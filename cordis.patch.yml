# ============================================================================
# dsh-token-heatmap —— DSH bundle patch
# ============================================================================
# 插件的挂载声明。DSH 启动时按 bundle 层叠加各插件 patch，本文件把 token
# 热力图插入当前 profile 的配置树。
#
# 安装（本地开发，link 到本目录）：
#   dsh plugin add "link:<本目录绝对路径>"
# 桌面应用的 profile 由应用独占管理，因此要在应用的「插件 → 添加插件」里填本目录路径。
# 卸载：
#   dsh plugin remove dsh-token-heatmap
#
# ⚠️ insert 里的 `name:` 必须与包名完全一致，否则 DSH 找不到模块。
# ============================================================================

- insert:
    - id: dsh-token-heatmap
      name: dsh-token-heatmap
